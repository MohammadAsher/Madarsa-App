<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A5342" />
      <stop offset="55%" stop-color="#11382C" />
      <stop offset="100%" stop-color="#1E140E" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2DFA6" />
      <stop offset="48%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8F6A24" />
    </linearGradient>
    <linearGradient id="paperLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF4E4" />
      <stop offset="85%" stop-color="#F6E9C8" />
      <stop offset="100%" stop-color="#DEC692" />
    </linearGradient>
    <linearGradient id="paperRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DEC692" />
      <stop offset="15%" stop-color="#F6E9C8" />
      <stop offset="100%" stop-color="#FBF4E4" />
    </linearGradient>
  </defs>

  <!-- Outer rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5" />
  <rect x="6" y="6" width="52" height="52" rx="10.5" fill="none" stroke="#C5A059" stroke-opacity="0.38" stroke-width="1" />

  <!-- Subtle 8-point Rub-el-Hizb star halo -->
  <g transform="translate(32 31)" opacity="0.32" stroke="url(#gold)" stroke-width="1.2" fill="none">
    <rect x="-17" y="-17" width="34" height="34" rx="2" />
    <rect x="-17" y="-17" width="34" height="34" rx="2" transform="rotate(45)" />
  </g>

  <!-- Gold crescent / crown accent above the Mushaf -->
  <circle cx="32" cy="12.5" r="2.1" fill="url(#gold)" />
  <path d="M24 14.5 Q32 10.5 40 14.5" fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" />

  <!-- Book binding / cover base -->
  <path
    d="M11 21.5 C17 19.5, 26 20, 32 23.2 C38 20, 47 19.5, 53 21.5 L53 47 C47 45, 38 45.2, 32 48.2 C26 45.2, 17 45, 11 47 Z"
    fill="#241811"
    stroke="url(#gold)"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Left ivory Mushaf page -->
  <path
    d="M13.5 23 C19 21.4, 26.5 22, 31.6 25 L31.6 45.4 C26.5 42.8, 19 42.4, 13.5 44 Z"
    fill="url(#paperLeft)"
  />

  <!-- Right ivory Mushaf page -->
  <path
    d="M50.5 23 C45 21.4, 37.5 22, 32.4 25 L32.4 45.4 C37.5 42.8, 45 42.4, 50.5 44 Z"
    fill="url(#paperRight)"
  />

  <!-- Center spine crease -->
  <line x1="32" y1="24.4" x2="32" y2="46.2" stroke="#7A5A20" stroke-width="1.2" />

  <!-- Illuminated script lines on left & right pages -->
  <g stroke="#164A3B" stroke-width="1.5" stroke-linecap="round" opacity="0.88">
    <line x1="16.8" y1="27.5" x2="28.4" y2="28.3" stroke="#9E6F1B" />
    <line x1="16.8" y1="31.5" x2="28.4" y2="32.2" />
    <line x1="16.8" y1="35.5" x2="28.4" y2="36.1" />
    <line x1="16.8" y1="39.5" x2="26.5" y2="39.9" />

    <line x1="35.6" y1="28.3" x2="47.2" y2="27.5" stroke="#9E6F1B" />
    <line x1="35.6" y1="32.2" x2="47.2" y2="31.5" />
    <line x1="35.6" y1="36.1" x2="47.2" y2="35.5" />
    <line x1="37.5" y1="39.9" x2="47.2" y2="39.5" />
  </g>

  <!-- Ribbon bookmark -->
  <path d="M30.6 45.2 L30.6 52.8 L32 51.3 L33.4 52.8 L33.4 45.2 Z" fill="url(#gold)" />
</svg>
